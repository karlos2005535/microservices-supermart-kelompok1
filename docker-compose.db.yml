networks:
  medcore-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  patient_db_vol:
  appointment_db_vol:
  pharmacy_db_vol:
  billing_db_vol:
  rabbitmq_data:
  redis_data:

services:
  # ================= API GATEWAY =================
  api-gateway:
    image: devopsfaith/krakend:2.6.3
    container_name: medcore-gateway
    ports:
      - "8000:8080"
    volumes:
      - ./gateway/krakend.json:/etc/krakend/krakend.json:ro
    networks:
      - medcore-net

  # ================= DATABASES (Ports Dikembalikan) =================
  patient-db:
    image: postgres:16-alpine
    container_name: medcore-patient-db
    environment:
      POSTGRES_USER: ${PATIENT_DB_USER}
      POSTGRES_PASSWORD: ${PATIENT_DB_PASS}
      POSTGRES_DB: ${PATIENT_DB_NAME}
    ports:
      - "${HOST_PORT_PATIENT_DB}:5432"
    volumes:
      - ./services/patient-service/ddl/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - patient_db_vol:/var/lib/postgresql/data
    networks:
      medcore-net:
        ipv4_address: 172.28.0.11

  appointment-db:
    image: postgres:16-alpine
    container_name: medcore-appointment-db
    environment:
      POSTGRES_USER: ${APPOINTMENT_DB_USER}
      POSTGRES_PASSWORD: ${APPOINTMENT_DB_PASS}
      POSTGRES_DB: ${APPOINTMENT_DB_NAME}
    ports:
      - "${HOST_PORT_APPOINTMENT_DB}:5432"
    volumes:
      - ./services/appointment-service/ddl/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - appointment_db_vol:/var/lib/postgresql/data
    networks:
      medcore-net:
        ipv4_address: 172.28.0.12

  pharmacy-db:
    image: mongo:7.0-jammy
    container_name: medcore-pharmacy-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS}
      MONGO_INITDB_DATABASE: ${PHARMACY_DB_NAME}
    ports:
      - "27018:27017" # <-- Mengembalikan port 27018
    volumes:
      - ./services/pharmacy-service/ddl/init.js:/docker-entrypoint-initdb.d/init.js:ro
      - pharmacy_db_vol:/data/db
    networks:
      medcore-net:
        ipv4_address: 172.28.0.13

  billing-db:
    image: mysql:8.0
    container_name: medcore-billing-db
    environment:
      MYSQL_ROOT_PASSWORD: ${BILLING_DB_ROOT_PASS}
      MYSQL_DATABASE: ${BILLING_DB_NAME}
      MYSQL_USER: ${BILLING_DB_USER}
      MYSQL_PASSWORD: ${BILLING_DB_PASS}
    ports:
      - "${HOST_PORT_BILLING_DB}:3306"
    volumes:
      - ./services/billing-service/ddl/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - billing_db_vol:/var/lib/mysql
    networks:
      medcore-net:
        ipv4_address: 172.28.0.14

  # ================= BROKER & CACHE =================
  message-broker:
    image: rabbitmq:3.13-management-alpine
    container_name: medcore-message-broker
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST}
    ports:
      - "${HOST_PORT_RABBITMQ_AMQP}:5672"
      - "${HOST_PORT_RABBITMQ_MGMT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      medcore-net:
        ipv4_address: 172.28.0.20

  medcore-redis:
    image: redis:7-alpine
    container_name: medcore-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      medcore-net:
        ipv4_address: 172.28.0.21
